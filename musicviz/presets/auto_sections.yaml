# Secciones automáticas: la app detecta calma / subida / drop y cambia la paleta, el fondo y la
# intensidad en cada tramo. Las capas con `colors: [palette]` siguen la paleta de la sección.
# El fondo hace zoom y vibra con los kicks (estilo Trap Nation). El glitch sólo actúa en los drops.
name: auto_sections
output:
  width: 1920
  height: 1080
  fps: 60
  codec: auto
audio:
  file: "{audio}"
  bands: 96
  fmin: 35
  fmax: 14000
sections: auto
auto_sections:
  min_length: 6
  transition: 0.8
  palettes:
    calm: ["#4cc9f0", "#4361ee", "#b5179e"]
    build: ["#f72585", "#7209b7", "#4361ee"]
    drop: ["#ff2a6d", "#ff7a00", "#ffd166"]
  background_colors:
    calm: ["#07122b", "#020308"]
    build: ["#1b0630", "#050208"]
    drop: ["#2b0410", "#050102"]
  intensities: {calm: 0.7, build: 1.0, drop: 1.35}
background:
  type: radial
  colors: ["#15052b", "#040208"]
  pulse: 0.06
  pulse_trigger: kick
  zoom: 1.08
  shake: 8
  shake_trigger: kick
  shake_rotation: 0.4
  react: 0.1
layers:
  - type: particles
    count: 150
    burst: 45
    burst_trigger: kick
    emitter: ring
    emitter_radius: 0.24
    direction: out
    speed: 25
    burst_speed: 420
    size: 2.6
    lifetime: 1.8
    colors: [palette]
    glow: 0.6
  - type: circle
    radius: 0.21
    length: 0.26
    thickness: 5
    mirror: true
    style: bars
    colors: [palette]
    gradient: angle
    pulse: 0.14
    pulse_trigger: kick
    rings: 2
    ring_spread: 0.07
    glow: 0.8
    glow_radius: 30
  - type: text
    text: "ARTISTA - TÍTULO"
    size: 0.045
    position: [0.5, 0.9]
    letter_spacing: 4
    glow: 0.5
    start: 1
    animate_in: slide_up
    in_duration: 0.8
effects:
  - type: bloom
    radius: 36
    threshold: 0.5
    strength: 0.9
  - type: glitch
    trigger: kick
    sections: [drop]
    probability: 0.6
    block_shift: 0.7
    rgb_split: 0.9
  - type: shake
    trigger: kick
    amount: 8
    zoom: 0.02
  - type: chromatic
    trigger: kick
    amount: 6
  - type: vignette
    strength: 0.55
