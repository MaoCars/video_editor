name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 xvfb libportaudio2

      - name: Instalar musicviz
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Comprobar entorno
        run: musicviz check

      - name: Tests (Linux, con pantalla virtual para la GUI)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" pytest -v

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -v
