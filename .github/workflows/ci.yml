name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # ffmpeg se instala con el gestor de paquetes del sistema: la acción de terceros setup-ffmpeg fallaba a menudo
      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 xvfb libportaudio2 libegl1 libgl1-mesa-dri libegl-mesa0 libgbm1 libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libxkbcommon0

      - name: Instalar ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Instalar musicviz (con backend CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[cpu,dev]

      - name: Comprobar entorno
        run: musicviz check

      - name: Tests (Linux, con pantalla virtual para la GUI)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" pytest -v

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: pytest -v

  gpu-only:
    name: ubuntu sin OpenCV (sólo backend GPU, como el ejecutable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 xvfb libportaudio2 libegl1 libgl1-mesa-dri libegl-mesa0 libgbm1 libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libxkbcommon0
      - name: Instalar musicviz sin OpenCV
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('cv2') else 0)"
      - name: Comprobar entorno
        run: musicviz check
      - name: Tests (los del backend CPU se omiten)
        run: xvfb-run -a -s "-screen 0 1280x800x24" pytest -v
