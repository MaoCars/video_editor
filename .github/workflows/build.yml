name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de un release existente al que adjuntar el ZIP (p. ej. v0.2.0); vacío = sólo artefacto"
        required: false
        default: ""

permissions:
  contents: write  # necesario para adjuntar el ZIP al release cuando se publica una etiqueta v*

env:
  FFMPEG_VERSION: "7.1.1"

jobs:
  ffmpeg:
    name: ffmpeg mínimo (Windows, estático)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Caché del ffmpeg compilado
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-min
          key: ffmpeg-min-${{ env.FFMPEG_VERSION }}-${{ hashFiles('packaging/ffmpeg/build_ffmpeg.sh') }}-ucrt64-v2
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: FFmpeg/FFmpeg
          ref: n${{ env.FFMPEG_VERSION }}
          path: ffmpeg-src
      # UCRT64: MSYS2 ya no publica x264 para el entorno MINGW64 (sólo ucrt64/clang64/clangarm64).
      # El runtime UCRT viene de serie en Windows 10 y 11.
      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils pkgconf
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libx264 mingw-w64-ucrt-x86_64-libvpx mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-ffnvcodec-headers
      - name: Compilar ffmpeg con sólo lo que usa musicviz
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          bash packaging/ffmpeg/build_ffmpeg.sh "$PWD/ffmpeg-src" "$PWD/ffmpeg-min" \
            --target-os=mingw32 --arch=x86_64 --enable-nvenc --enable-ffnvcodec \
            --extra-ldflags="-static -static-libgcc -static-libstdc++" --extra-cflags="-O2"
          ls -la ffmpeg-min/bin
          ./ffmpeg-min/bin/ffmpeg.exe -hide_banner -version
          ./ffmpeg-min/bin/ffmpeg.exe -hide_banner -encoders | grep -E "nvenc|libx264|aac|prores|libvpx|png|qtrle"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-min
          path: ffmpeg-min/bin/ffmpeg.exe

  windows:
    needs: ffmpeg
    # Si el ffmpeg mínimo no se pudo compilar, se empaqueta igualmente con el ffmpeg "essentials" descargado:
    # un release nunca debe quedarse sin ZIP.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.ffmpeg.result == 'success'
        with:
          name: ffmpeg-min
          path: ffmpeg-min
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Construir ejecutable con el ffmpeg mínimo incluido
        run: |
          if (Test-Path ffmpeg-min/ffmpeg.exe) {
            python packaging/build.py --ffmpeg-exe ffmpeg-min/ffmpeg.exe --zip
          } else {
            Write-Output "::warning::No se compiló el ffmpeg mínimo; se incluye el ffmpeg 'essentials' (ZIP más pesado)"
            python packaging/build.py --ffmpeg --zip
          }
      - name: Probar el ejecutable
        run: |
          dist\musicviz\musicviz.exe --version
          dist\musicviz\musicviz.exe check --require audio --require glfw
          dist\musicviz\musicviz.exe presets
      - name: Subir ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: musicviz-windows
          path: dist/*.zip
      - name: Publicar release (etiquetas v*, o la etiqueta indicada al lanzarlo a mano)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: dist/*.zip
